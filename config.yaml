# Configuração do Clipador. Todos os valores podem ser sobrescritos via CLI quando houver flag.

clips:
  max_clips: 5
  min_seconds: 20
  max_seconds: 60
  pre_roll_seconds: [2, 4]      # começa 2–4 s antes do gancho
  min_gap_seconds: 10           # distância mínima entre cortes (evita sobreposição)

download:
  cookies_from_browser: null    # ex.: "chrome", "firefox", "edge"
  analysis_video_height: 360    # vídeo leve só para análise (facecam/movimento)
  clip_video_height: 1080       # qualidade dos trechos escolhidos

transcribe:
  model: large-v3               # small / medium / large-v3 / large-v3-turbo
  language: pt
  device: auto                  # auto / cuda / cpu
  compute_type: auto            # auto / float16 / int8
  vad_filter: true

detect:
  weights:                      # somam 1.0 (são renormalizados se não somarem)
    chat: 0.35
    audio: 0.25
    semantic: 0.40
  chat:
    rolling_window_seconds: 300
    reaction_tokens: ["KEKW", "LUL", "OMEGALUL", "kkkk", "MDS", "?????", "PogChamp", "Pog", "monkaS", "LMAO"]
  semantic:
    enabled: true
    model: claude-sonnet-5-5
    screening_model: claude-haiku-5-5   # triagem barata antes do modelo principal
    max_candidates: 30                  # só os N melhores candidatos vão para o Claude

layout:
  width: 1080
  height: 1920
  fps: auto                     # auto (mantém 30/60 da fonte) ou número
  facecam:
    mode: auto                  # auto / manual / off
    manual_box: null            # [x, y, w, h] em fração da tela (0–1), ex.: [0.72, 0.70, 0.27, 0.28]
    top_fraction: 0.33          # altura da facecam no vertical
  no_facecam: smart_crop        # smart_crop / blur_background / center

captions:
  font: Montserrat Black
  font_file: assets/fonts/Montserrat-Black.ttf
  size: 92
  words_per_group: [1, 3]
  primary_color: "#FFFFFF"
  highlight_color: "#FFE600"
  outline_color: "#000000"
  outline: 8
  shadow: 2
  uppercase: true
  position: between             # between (entre facecam e gameplay) / bottom / center
  fixes:                        # correções aplicadas na transcrição
    "cá ca ca": "kkk"

render:
  video_codec: libx264
  crf: 20
  preset: medium
  audio_lufs: -14
  audio_true_peak: -1.0

paths:
  cache_dir: cache
  output_dir: output
